[package]
name = "atcoder_cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "acc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
dirs = "6.0.0"
reqwest = { version = "0.13.3", features = ["json", "blocking", "cookies", "query"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
