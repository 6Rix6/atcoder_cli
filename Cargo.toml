[package]
name = "atcoder_cli"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "acc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
dirs = "6.0.0"
fuzzy-matcher = "0.3.7"
html2md = "0.2.15"
indicatif = "0.18.4"
nix = { version = "0.31.3", features = ["process", "signal"] }
regex = "1.12.4"
reqwest = { version = "0.13.3", features = ["blocking"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
which = "8.0.4"
